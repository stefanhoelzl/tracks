name: macos
runs-on: macos-26
# A dev session reads the caches CI keeps and never writes one: whatever it builds is throwaway, and a cache
# written from a half-edited tree would be restored into the next real CI run.
steps:
  - uses: pnpm/action-setup@v6
  - uses: actions/setup-node@v7
    with:
      node-version: 24
      # No pnpm cache: nothing on main installs with pnpm on macOS, so there is none to reuse.
      package-manager-cache: false
  - run: pnpm install --frozen-lockfile
  # The iOS app: Gradle builds the Kotlin framework inside the Xcode build, and XcodeGen regenerates
  # app/iosApp/iosApp.xcodeproj from project.yml.
  - uses: actions/setup-java@v6
    with:
      distribution: temurin
      java-version: 25
  - uses: gradle/actions/setup-gradle@v6
    with:
      cache-read-only: true
  # Kotlin/Native's toolchain, from the cache CI's ios job keeps under the same key.
  - uses: actions/cache/restore@v6
    with:
      path: ~/.konan
      key: konan-${{ runner.os }}-${{ hashFiles('app/gradle/libs.versions.toml') }}
  - run: brew install xcodegen
sync:
  delete: true
  # node_modules holds platform-native binaries (esbuild), so the runner keeps its own. Build output, Gradle's
  # state and the device flow's archives are the runner's own too: pushing a Linux build/ would be wrong and big.
  exclude: [.git, node_modules, dist, data, .secrets.yaml, build, .gradle, .kotlin, artifacts, ios-device-out]
