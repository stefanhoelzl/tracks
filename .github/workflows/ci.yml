# Tests on everything, deploys on main.
#
# The repository is public, so the split is not tidiness: the test job holds no
# secrets at all and runs on pull requests, including a stranger's fork, while the
# deploy job is gated on a push to main. GitHub withholds secrets from workflows a
# fork triggers, so the credentials cannot leave by that door even if this file
# invited them to.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# One deploy at a time. Two pushes in quick succession would otherwise race each
# other to apply migrations, and the loser would be applying them to a database the
# winner had already moved on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `check` is biome and both typecheck passes; `test` is the whole suite, both
      # lanes. Neither touches a network.
      - run: pnpm check
      - run: pnpm test

      # Built here as well as in the deploy job, so a pull request finds out that the
      # bundle no longer fits inside 10MB — which is a review comment, not a failed
      # deploy after the fact.
      - run: pnpm build

  # The iPhone app's shared Kotlin, on the JVM and as native Linux code. No secrets, like
  # `test`, and not something `deploy` waits for: nothing the edge serves is built here.
  # That the Kotlin still agrees with the TypeScript is checked from both sides — `test`
  # fails when the fixtures are stale, this fails when the Kotlin disagrees with them.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native's prebuilt compiler and its LLVM toolchain, about a gigabyte that
      # would otherwise download on every run. Keyed on the versions, which pin it.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('app/gradle/libs.versions.toml') }}

      - run: ./gradlew :shared:jvmTest :shared:linuxX64Test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @bunny.net/cli

      # Schema first, always. The script deployed below is written against the schema
      # this applies, so the reverse order would put a deployment in front of the
      # columns it queries. Migrations run in filename order and carry their own
      # tracking row, so this is a no-op on every deploy that adds none.
      #
      # The script gets its database injected, because the two are connected on Bunny's
      # side; a GitHub runner is not the script, so it names the database by id. The id
      # is *not* the ULID in the database's hostname — those are minted in the same
      # instant and share their first ten characters, the ULID timestamp, then differ,
      # which is plausible enough to derive and wrong. `bunny db list` has the real one.
      #
      # It identifies rather than authorises: the API key looks the database up and
      # mints a token for the run, so no database credential is stored here at all.
      - name: Apply migrations
        run: bunny db migrations apply ${{ vars.BUNNY_DATABASE_ID }} --force

      - run: pnpm build

      # `dist/script.js` carries the browser bundle inside it, so this one file is the
      # whole deployment: no assets to upload separately and no window in which the
      # shell and the JavaScript it names disagree.
      - name: Deploy the script
        run: bunny scripts deploy packages/edge/dist/script.js ${{ vars.BUNNY_SCRIPT_ID }}

