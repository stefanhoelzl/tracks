# The Xcode project, as XcodeGen generates it. `iosApp.xcodeproj` is committed so neither CI nor a
# build needs XcodeGen; after changing this file, regenerate it on a Mac and commit both:
#
#     cd app/iosApp && xcodegen generate
#
# The shell hosts the Compose UI (M11) and M10's measurement harness, which runs instead when launched with
# TRACKS_MEASURE set. The Kotlin comes from :ui — which exports :shared — as one static framework, built by the
# pre-build script for whatever configuration and SDK Xcode is building.
name: iosApp
options:
  bundleIdPrefix: net.stho
  deploymentTarget:
    # The map library's bundled ICU needs 18.5 (spike B). Set now so M11 does not move it.
    iOS: "18.5"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # brouter.de's profiles and the parity route list travel with the app; the rd5 tiles do not —
      # they are pushed into Documents/segments, as downloaded tiles will be (M13).
      - path: ../brouter/profiles
        type: folder
        buildPhase: resources
      - path: ../brouter/parity/routes.tsv
        buildPhase: resources
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Tracks
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Foreground only: background location arrives with recording (M15).
        NSLocationWhenInUseUsageDescription: Tracks shows where you are on the map, and which way you are heading.
        # Lets Compose draw at 120 Hz on ProMotion screens.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.stho.tracks
        PRODUCT_NAME: Tracks
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # Shared is the whole Kotlin side (:ui, exporting :shared). The rest is what maplibre-compose's statically
        # linked MapLibre Native needs from the system, as its iOS docs list it, and CoreLocation for LocationSensors.
        OTHER_LDFLAGS: [
          "$(inherited)", "-framework", "Shared",
          "-lc++", "-lz",
          "-framework", "CoreFoundation", "-framework", "CoreGraphics", "-framework", "CoreLocation",
          "-framework", "CoreText", "-framework", "Foundation", "-framework", "ImageIO",
          "-framework", "Metal", "-framework", "QuartzCore",
        ]
        # The Gradle build reads and writes outside the sandbox Xcode gives build scripts.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 25 2>/dev/null || /usr/libexec/java_home)}"
          cd "$SRCROOT/.."
          ./gradlew :ui:embedAndSignAppleFrameworkForXcode
