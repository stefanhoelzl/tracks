# The Xcode project, as XcodeGen generates it. `iosApp.xcodeproj` is committed so neither CI nor a
# build needs XcodeGen; after changing this file, regenerate it on a Mac and commit both:
#
#     cd app/iosApp && xcodegen generate
#
# M10's shell hosts the converted engine and nothing else: no screens, a measurement harness that only
# runs when launched with TRACKS_MEASURE set. The Kotlin comes from :shared as a static framework, built by
# the pre-build script for whatever configuration and SDK Xcode is building.
name: iosApp
options:
  bundleIdPrefix: net.stho
  deploymentTarget:
    # The map library's bundled ICU needs 18.5 (spike B). Set now so M11 does not move it.
    iOS: "18.5"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # brouter.de's profiles and the parity route list travel with the app; the rd5 tiles do not —
      # they are pushed into Documents/segments, as downloaded tiles will be (M13).
      - path: ../brouter/profiles
        type: folder
        buildPhase: resources
      - path: ../brouter/parity/routes.tsv
        buildPhase: resources
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Tracks
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.stho.tracks
        PRODUCT_NAME: Tracks
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        # The Gradle build reads and writes outside the sandbox Xcode gives build scripts.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 252>/dev/null || /usr/libexec/java_home)}"
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
