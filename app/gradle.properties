# The Gradle and Kotlin daemons are capped. The machine this is developed on often has
# ~9 GB free with other workspaces busy, and an uncapped Kotlin/Native build is what got
# a process OOM-killed during the spike.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.workers.max=4

kotlin.code.style=official

# The iOS targets cannot build on Linux. Without this, every Linux build warns about them.
kotlin.native.ignoreDisabledTargets=true
